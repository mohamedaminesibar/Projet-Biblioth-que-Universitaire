      // Safeguard for browser extension / evaluation runners that monkey-patch window.fetch
      (function() {
        try {
          var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var _currentFetch = _origFetch;
          var descriptor = {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
